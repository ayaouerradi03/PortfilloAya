name: Deploy to GitHub Pages

# Every push to main publishes the site. `workflow_dispatch` also lets you
# re-run a deploy by hand from the Actions tab without pushing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment action. `id-token` is what lets
# deploy-pages authenticate without a personal access token.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run rather than racing it — but
# never cancel a deploy that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the build uses exactly the versions in
      # package-lock.json — a deploy should never resolve new dependencies.
      - name: Install dependencies
        run: npm ci

      # Fails the deploy on a type error or lint violation, so a broken build
      # never reaches the public URL.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
