name: Deploy to GitHub Pages

# Every push to main publishes the site. `workflow_dispatch` also lets you
# re-run a deploy by hand from the Actions tab without pushing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment action. `id-token` is what lets
# deploy-pages authenticate without a personal access token, and `pages: write`
# is what allows the enablement step below to turn Pages on by itself.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, queue the runs rather than racing them — but
# never cancel a deploy that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) so the build uses exactly the versions in
      # package-lock.json — a deploy should never resolve new dependencies.
      - name: Install dependencies
        run: npm ci

      # Fails the deploy on a lint violation, so a broken build never reaches
      # the public URL. `npm run build` type-checks via `tsc -b` as well.
      - name: Lint
        run: npm run lint

      # enablement: true asks the API to switch Pages on if it is still off.
      # It only succeeds where the workflow token is allowed to create a Pages
      # site; GITHUB_TOKEN cannot be granted the admin rights that call needs,
      # so on most repositories this is a no-op that fails with "Resource not
      # accessible by integration". It is kept because it costs nothing once
      # Pages *is* on (the action just reads the existing config), and because
      # it works on setups where the token is permitted.
      #
      # continue-on-error lets the clearer message in the next step be the one
      # that actually stops the run.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The raw API error above says nothing about what to actually do, so
      # translate it into the one-time manual step a repo owner has to take.
      # This covers both failure modes: Pages switched off entirely, and Pages
      # switched on but pointed at a branch instead of Actions — the latter
      # silently serves the repository source, so the site loads as a blank
      # page with no error anywhere.
      - name: Check Pages source
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages source is not set to Actions::A repository admin must set Settings → Pages → Source to 'GitHub Actions'."
          cat <<'MSG'

          ────────────────────────────────────────────────────────────────
           This workflow cannot publish, because GitHub Pages is either off
           or set to deploy from a branch rather than from Actions.

           It tried to correct that automatically and was refused: changing
           the Pages source needs repo-admin rights the Actions token
           cannot hold.

           A repository ADMIN (the owner) has to set this once:

             Settings → Pages → Build and deployment
             Source:  GitHub Actions          <-- not "Deploy from a branch"

           The repository must also be Public, unless the account is on a
           paid plan.

           NOTE: if Source is left on "Deploy from a branch", the site will
           still return HTTP 200 — but it serves the raw repository (the
           unbuilt index.html, package.json, src/ ...), which renders as a
           BLANK PAGE. A working deploy must come from this workflow.

           Re-run this workflow afterwards. Nothing in the code changes.
          ────────────────────────────────────────────────────────────────

          MSG
          exit 1

      # The base path has to match the repo name, because a project page is
      # served from /<repo>/ rather than the domain root. Deriving it from the
      # repository context instead of hardcoding it means this keeps working if
      # the project is renamed or transferred to another account — including to
      # Aya's — with no edit to the config. A <owner>.github.io repo is a user
      # page served from the root, so it is special-cased to "/".
      - name: Build
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          if [ "$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]').github.io" ]; then
            export BASE_PATH='/'
          else
            export BASE_PATH="/$repo/"
          fi
          echo "Building with BASE_PATH=$BASE_PATH"
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
